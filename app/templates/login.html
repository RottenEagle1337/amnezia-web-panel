{% extends "base.html" %}
{% block title %}Sign in — Amnezia Panel{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1><span class="logo">Amnezia<span>Panel</span></span></h1>
    {% if error == 'rate' %}<p class="error">Too many attempts — wait 5 minutes.</p>
    {% elif error %}<p class="error">Wrong password.</p>{% endif %}
    <form method="post" action="/login">
      <input type="password" name="password" placeholder="Password" autofocus required>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
